name: JavaScope CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# No secrets required for CI pipeline
permissions:
  contents: read

jobs:
  # (a) On every push: Java build, tracer golden tests, frontend lint, unit tests, and production build
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Run Tracer Tests & Golden Suite
        working-directory: services/tracer
        run: mvn test -B

      - name: Run API Unit Tests (excl. hostile container)
        working-directory: services/api
        run: mvn test -B -Dtest="!HostileContainerTest"

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Frontend Lint
        working-directory: apps/web
        run: npm run lint

      - name: Run Frontend Unit & Component Tests (Vitest)
        working-directory: apps/web
        run: npm test -- --run

      - name: Build Frontend Production Bundle
        working-directory: apps/web
        run: npm run build

  # (b) Sandbox image build, hostile security suite, and container integration tests
  sandbox-and-integration:
    name: Sandbox & Hostile Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package Tracer Fat JAR
        working-directory: services/tracer
        run: mvn package -DskipTests -B

      - name: Build Sandbox Docker Image
        run: docker build -t javascope-sandbox:latest -f sandbox/Dockerfile .

      - name: Run Hostile Container Security Tests (Shell)
        run: bash scripts/test-security.sh

      - name: Run Hostile Container JUnit Integration Tests
        working-directory: services/api
        run: mvn test -B -Dtest=HostileContainerTest

  # (c) Playwright End-to-End Suite against the real stack
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Tracer & API JARS
        run: |
          mvn package -DskipTests -B -pl services/tracer,services/api

      - name: Build Sandbox Docker Image
        run: docker build -t javascope-sandbox:latest -f sandbox/Dockerfile .

      - name: Install Frontend Dependencies & Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Spring Boot API Server
        run: |
          java -Xmx256m -Djavascope.rateLimit.runsPerMinute=1000 -jar services/api/target/api-1.0.0-SNAPSHOT.jar > api.log 2>&1 &
          echo "Waiting for API to start on port 8080..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health >/dev/null 2>&1 || curl -s http://localhost:8080/api/run >/dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            sleep 1
          done

      - name: Run Playwright E2E Tests
        working-directory: apps/web
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Results & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
